<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Online-cinema</title>
</head>

<body class="m-0 p-0" style="background-color: #559AF5;">

    <header class="d-flex justify-content-between align-items-center w-100 px-4 py-3" style="background-color: #0032E6;">
        
        <div class="logo">
            <h1 class="text-white mb-0">Online-cinema</h1>
        </div>

        <form class="d-flex gap-2 mx-4 flex-grow-1" style="max-width: 500px;" role="search">
            <input class="form-control bg-light" type="search" 
                   placeholder="Фильмы, сериалы..." aria-label="Search">
            <button class="btn" style="background-color: #559AF5;" type="submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                </svg>
            </button>
        </form>

        <div class="d-flex gap-2">
            <button type="button" class="btn" style="background-color: #559AF5; color: white;">Войти</button>
            <button type="button" class="btn" style="background-color: #559AF5; color: white;">Поддержать проект</button>
        </div>

    </header>

    <section class="cards">
        <div class="card">
            <p>5,0</p>
            <img src="movie_img" alt="movie_img">
            h1
        </div>
    </section>

</body>

</html>
